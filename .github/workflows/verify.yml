name: Verify audit deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Offline audit and deployment tests
        run: >-
          python -m unittest -q
          test_aws_daily_audit test_daily_delivery test_lark_notify
          test_audit_access test_audit_web test_access_delivery
          test_deployment test_nginx_config test_install_script
      - name: Bash syntax and deployment preview
        run: |
          bash -n install.sh
          bash install.sh --dry-run --python python
      - name: Install syntax-check tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends nginx systemd
      - name: Validate generated units and isolated Nginx configuration
        run: python deploy/verify_linux.py
